# Tmux Configuration for Agentic Development Orchestration
# Copy this to ~/.tmux.conf or source it with: tmux source-file this-file.conf
#
# Optimized for multi-phase development monitoring
#

# ─────────────────────────────────────────────────────────────────────────────
# GENERAL SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

# Use 256 colors
set -g default-terminal "screen-256color"

# Enable mouse support (scrolling, clicking panes, resizing)
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Start window numbering at 1 (easier keyboard access)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster key repetition
set -s escape-time 0

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Refresh status bar more frequently
set -g status-interval 5

# ─────────────────────────────────────────────────────────────────────────────
# KEY BINDINGS
# ─────────────────────────────────────────────────────────────────────────────

# Remap prefix from 'C-b' to 'C-a' (optional, uncomment if preferred)
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Shift-arrow without prefix
bind -n S-Left previous-window
bind -n S-Right next-window

# Quick window navigation (Alt+number)
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Synchronize panes (send same command to all panes)
bind S setw synchronize-panes

# ─────────────────────────────────────────────────────────────────────────────
# STATUS BAR DESIGN (Optimized for Agentic Development)
# ─────────────────────────────────────────────────────────────────────────────

# Status bar position
set -g status-position bottom

# Status bar colors
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'

# Left side: Session name
set -g status-left-length 40
set -g status-left '#[fg=#7aa2f7,bold] #S #[fg=#565f89]| '

# Right side: Date and time
set -g status-right-length 60
set -g status-right '#[fg=#565f89]| #[fg=#bb9af7]%Y-%m-%d #[fg=#7aa2f7]%H:%M #[fg=#9ece6a,bold]'

# Window status format
set -g window-status-format '#[fg=#565f89] #I:#W '
set -g window-status-current-format '#[fg=#7aa2f7,bold,bg=#24283b] #I:#W* '

# Window with activity
setw -g window-status-activity-style 'fg=#f7768e,bold'

# ─────────────────────────────────────────────────────────────────────────────
# PANE DESIGN
# ─────────────────────────────────────────────────────────────────────────────

# Pane borders
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# Pane numbers display (prefix + q)
set -g display-panes-time 2000
set -g display-panes-colour '#565f89'
set -g display-panes-active-colour '#7aa2f7'

# ─────────────────────────────────────────────────────────────────────────────
# COPY MODE (VI-style)
# ─────────────────────────────────────────────────────────────────────────────

# Use vi keys in copy mode
setw -g mode-keys vi

# Enter copy mode with prefix + [
# Start selection with 'v'
# Copy selection with 'y'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Search in copy mode
bind -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""

# ─────────────────────────────────────────────────────────────────────────────
# AGENTIC DEVELOPMENT SPECIFIC BINDINGS
# ─────────────────────────────────────────────────────────────────────────────

# Quick access to dashboard (window 0/1 depending on base-index)
bind D select-window -t 1

# Create new phase window with standard layout
bind P command-prompt -p "Phase name:" "new-window -n '%1' -c '#{pane_current_path}' \; \
    split-window -v -p 30 \; \
    send-keys 'watch -n 5 cat .phase-status/PROGRESS.md' Enter \; \
    split-window -h -p 50 \; \
    send-keys 'watch -n 10 git log --oneline -8' Enter \; \
    select-pane -t 0"

# Toggle zoom on current pane (useful for focusing on subagent work)
bind z resize-pane -Z

# Quick capture pane output to file
bind C command-prompt -p "Save to:" "capture-pane -S -32768 ; save-buffer '%1'"

# ─────────────────────────────────────────────────────────────────────────────
# PLUGINS (Optional - requires TPM)
# ─────────────────────────────────────────────────────────────────────────────

# Install TPM (Tmux Plugin Manager):
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Then add these plugins and press prefix + I to install:

# List of plugins
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'      # Save/restore sessions
# set -g @plugin 'tmux-plugins/tmux-continuum'      # Auto-save sessions
# set -g @plugin 'tmux-plugins/tmux-yank'           # Better copy-paste

# Resurrect settings (if using tmux-resurrect)
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-nvim 'session'

# Continuum settings (if using tmux-continuum)
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
# run '~/.tmux/plugins/tpm/tpm'

# ─────────────────────────────────────────────────────────────────────────────
# NOTES
# ─────────────────────────────────────────────────────────────────────────────
#
# Key bindings quick reference (assuming default prefix Ctrl-b):
#
# SESSION:
#   prefix d     - Detach from session
#   prefix $     - Rename session
#   prefix s     - List sessions
#
# WINDOWS:
#   prefix c     - Create window
#   prefix ,     - Rename window
#   prefix n/p   - Next/previous window
#   prefix 0-9   - Go to window N
#   Alt+0-9      - Go to window N (no prefix needed)
#   prefix D     - Go to dashboard
#   prefix P     - Create new phase window with layout
#
# PANES:
#   prefix |     - Split vertically (new pane right)
#   prefix -     - Split horizontally (new pane below)
#   Alt+arrows   - Navigate panes (no prefix needed)
#   prefix z     - Toggle pane zoom
#   prefix x     - Close pane
#   prefix q     - Show pane numbers
#   prefix S     - Synchronize panes (same input to all)
#   prefix HJKL  - Resize panes
#
# COPY MODE:
#   prefix [     - Enter copy mode
#   v            - Start selection (in copy mode)
#   y            - Copy selection (in copy mode)
#   q            - Exit copy mode
#   /            - Search forward
#   ?            - Search backward
#
# UTILITY:
#   prefix r     - Reload config
#   prefix C     - Capture pane to file
#
