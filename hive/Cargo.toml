[package]
name = "hive"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for monitoring AI agent sessions"
license = "MIT"
repository = "https://github.com/youruser/hive"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# tmux
tmux_interface = "0.3"

# Git
git2 = "0.19"

# File watching
notify = "7"

# System metrics
sysinfo = "0.32"

# Fuzzy matching
nucleo = "0.5"

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }
directories = "5"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
